<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鬍子運動 器械皮拉提斯 | 團課線上預約</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col items-center p-4 sm:p-6">

  <!-- 頂部 Header -->
  <header class="w-full max-w-md text-center py-6">
    <h1 class="text-2xl font-bold tracking-wide text-stone-900">鬍子運動</h1>
    <p class="text-sm font-medium text-amber-700 tracking-wider mt-1">器械皮拉提斯 團課預約</p>
  </header>

  <!-- 預約表單卡片 -->
  <main class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-stone-200/80 p-6 space-y-6" id="booking-card">
    
    <!-- 步驟 1: 選擇身份/預約方式 -->
    <div>
      <label class="block text-sm font-semibold text-stone-700 mb-2">1. 請選擇預約方式</label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="selectType('單次轉帳預約')" id="btn-single" class="py-3 px-4 rounded-xl border border-stone-300 text-sm font-medium text-stone-700 hover:border-amber-600 focus:outline-none transition-all text-center">
          單次轉帳預約
        </button>
        <button type="button" onclick="selectType('包堂/扣點預約')" id="btn-pass" class="py-3 px-4 rounded-xl border border-stone-300 text-sm font-medium text-stone-700 hover:border-amber-600 focus:outline-none transition-all text-center">
          包堂/扣點預約
        </button>
      </div>
      <input type="hidden" id="bookingType" value="單次轉帳預約">
    </div>

    <!-- 步驟 2: 選擇課程時段 (每班上限6人) -->
    <div>
      <label class="block text-sm font-semibold text-stone-700 mb-2">2. 選擇課程時段（每班上限 6 人）</label>
      <div class="space-y-2">
        <label class="flex items-center justify-between p-3.5 border rounded-xl cursor-pointer hover:bg-stone-50 transition-all border-stone-200">
          <div class="flex items-center space-x-3">
            <input type="radio" name="slot" value="10/20 (二) 19:00 - 核心床基礎" checked class="text-amber-600 focus:ring-amber-500">
            <div>
              <p class="text-sm font-medium text-stone-800">10/20 (二) 19:00 - 核心床基礎</p>
              <p class="text-xs text-stone-500">每班限額 6 人</p>
            </div>
          </div>
          <span class="text-xs bg-emerald-100 text-emerald-800 font-medium px-2.5 py-1 rounded-full">可預約</span>
        </label>

        <label class="flex items-center justify-between p-3.5 border rounded-xl cursor-pointer hover:bg-stone-50 transition-all border-stone-200">
          <div class="flex items-center space-x-3">
            <input type="radio" name="slot" value="10/20 (二) 20:15 - 全身雕塑" class="text-amber-600 focus:ring-amber-500">
            <div>
              <p class="text-sm font-medium text-stone-800">10/20 (二) 20:15 - 全身雕塑</p>
              <p class="text-xs text-stone-500">每班限額 6 人</p>
            </div>
          </div>
          <span class="text-xs bg-emerald-100 text-emerald-800 font-medium px-2.5 py-1 rounded-full">可預約</span>
        </label>
      </div>
    </div>

    <!-- 步驟 3: 填寫基本資料 -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">姓名</label>
        <input type="text" id="userName" placeholder="請輸入姓名" class="w-full px-3.5 py-2.5 rounded-lg border border-stone-300 text-sm focus:ring-2 focus:ring-amber-500/20 focus:border-amber-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">手機號碼（辨識包堂卡號用）</label>
        <input type="tel" id="userPhone" placeholder="例如：0912345678" class="w-full px-3.5 py-2.5 rounded-lg border border-stone-300 text-sm focus:ring-2 focus:ring-amber-500/20 focus:border-amber-600 outline-none">
      </div>

      <!-- 轉帳專用欄位 -->
      <div id="payment-fields" class="space-y-4 pt-2 border-t border-stone-100">
        <div class="bg-amber-50/60 p-3.5 rounded-xl border border-amber-200/60 text-xs text-stone-700 space-y-1">
          <p class="font-semibold text-amber-900">🏦 匯款帳號資訊</p>
          <p>銀行代碼：008 華南銀行</p>
          <p>帳號：752-10-007133-0</p>
          <p>初次體驗價：$700 / 單堂：$900 / 5堂套票 $4,250(效期90天) / 10堂套票 $8,000(效期180天)</p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">轉帳帳號末五碼</label>
          <input type="text" id="bankLast5" maxlength="5" placeholder="例如：12345" class="w-full px-3.5 py-2.5 rounded-lg border border-stone-300 text-sm focus:ring-2 focus:ring-amber-500/20 focus:border-amber-600 outline-none">
        </div>
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button type="button" onclick="submitBooking()" id="submitBtn" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-medium py-3 rounded-xl transition-all shadow-sm active:scale-[0.99]">
      確認送出預約
    </button>
  </main>

  <!-- 完成感謝頁面 -->
  <main id="success-card" class="hidden w-full max-w-md bg-white rounded-2xl shadow-sm border border-stone-200/80 p-6 text-center space-y-5">
    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
    <h2 class="text-xl font-bold text-stone-900">預約已收到！</h2>
    <div class="bg-stone-50 p-4 rounded-xl text-sm text-stone-700 leading-relaxed text-left border border-stone-200">
      我們已記錄您的末五碼，對帳完成後將透過 <strong>官方LINE</strong> 與您確認，完成付款請至官方line留言<strong>預約日期+時間+姓名</strong>
    </div>
    <a href="https://line.me" target="_blank" class="block w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-medium py-3 rounded-xl transition-all shadow-sm">
      前往官方 LINE 留言確認
    </a>
  </main>

  <script>
    // ⚠️ 請替換為您發布的 Google Apps Script Web App URL
    const https://script.google.com/macros/s/AKfycbyKPhalQnpWzAGlyanKfZqoOu6N1AYiGzj7UnljkCNR3SAhv7VplrZu6mqd6_cuH5vJzg/exec = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    function selectType(type) {
      document.getElementById('bookingType').value = type;
      const payFields = document.getElementById('payment-fields');
      const btnSingle = document.getElementById('btn-single');
      const btnPass = document.getElementById('btn-pass');

      if (type === '單次轉帳預約') {
        payFields.classList.remove('hidden');
        btnSingle.className = "py-3 px-4 rounded-xl border-2 border-amber-600 bg-amber-50/30 text-sm font-semibold text-amber-900 text-center";
        btnPass.className = "py-3 px-4 rounded-xl border border-stone-300 text-sm font-medium text-stone-700 hover:border-amber-600 text-center";
      } else {
        payFields.classList.add('hidden');
        btnPass.className = "py-3 px-4 rounded-xl border-2 border-amber-600 bg-amber-50/30 text-sm font-semibold text-amber-900 text-center";
        btnSingle.className = "py-3 px-4 rounded-xl border border-stone-300 text-sm font-medium text-stone-700 hover:border-amber-600 text-center";
      }
    }

    async function submitBooking() {
      const type = document.getElementById('bookingType').value;
      const name = document.getElementById('userName').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const slot = document.querySelector('input[name="slot"]:checked')?.value;
      const last5 = document.getElementById('bankLast5').value.trim();

      if (!name || !phone) {
        alert("請填寫姓名與手機號碼！");
        return;
      }
      if (type === '單次轉帳預約' && last5.length !== 5) {
        alert("請填寫正確的轉帳帳號末五碼（5位數）！");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "預約傳送中...";

      try {
        await fetch(https://script.google.com/macros/s/AKfycbyKPhalQnpWzAGlyanKfZqoOu6N1AYiGzj7UnljkCNR3SAhv7VplrZu6mqd6_cuH5vJzg/exec, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: type,
            name: name,
            phone: phone,
            slot: slot,
            last5: type === '包堂/扣點預約' ? '包堂扣點' : last5
          })
        });

        document.getElementById('booking-card').classList.add('hidden');
        document.getElementById('success-card').classList.remove('hidden');
      } catch (err) {
        alert("預約傳送失敗，請再試一次或透過 LINE 直接聯繫我們！");
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出預約";
      }
    }
  </script>
</body>
</html>
